[project]
name = "data-challenge-classification"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "justinelesecq", email = "justinelesecq@yahoo.fr" }
]
requires-python = ">=3.12,<3.13"
dependencies = [
    "autogluon>=1.6.3",
    "matplotlib",
    "numpy",
    "optuna>=5.0.0",
    "pandas",
    "scikit-learn",
    "scipy>=1.18.1",
    "torch>=2.10.0",
    "xgboost>=3.3.0",
]

[project.scripts]
data-challenge-classification = "data_challenge_classification:main"

[build-system]
requires = ["uv_build>=0.13.8,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "ipykernel>=7.4.0",
    "jupyter>=1.1.1",
    "jupyterlab>=4.6.6",
]
